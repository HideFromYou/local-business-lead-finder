<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Finder · Google</title>
  <link rel="stylesheet" href="/static/vendor/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="maps">
  <aside class="sidebar">
    <div class="side-head">
      <div>
        <h1>Lead Finder</h1>
        <p class="sub">Επιχειρήσεις χωρίς website</p>
      </div>
      <nav class="actions">
        <a class="button" href="/google">Google</a>
        <a class="button secondary" href="/">Λίστα OSM</a>
      </nav>
    </div>

    <section class="search">
      <label>Τι ψάχνεις <input id="query" type="text" maxlength="100" placeholder="π.χ. φαρμακεία"></label>
      <label>Περιοχή <input id="area-name" type="text" maxlength="100" placeholder="π.χ. Πεύκα"></label>
      <div class="chips" id="chips"></div>
      <details class="advanced">
        <summary>Προχωρημένα</summary>
        <div class="adv-body">
          <label>Φίλτρο περιοχής (προαιρετικό) <input id="area-hint" type="text" maxlength="100" placeholder="π.χ. Θεσσαλονίκη"></label>
          <label>Κάλυψη
            <select id="grid">
              <option value="1">Γρήγορη · έως 3 κλήσεις</option>
              <option value="2">Μεσαία · έως 12 κλήσεις</option>
              <option value="3">Μεγάλη · έως 27 κλήσεις</option>
            </select>
          </label>
          <label>Ακτίνα (m) <input id="radius" type="number" min="100" max="5000" step="100" value="1500"></label>
        </div>
      </details>
      <button id="search-btn" class="button wide">Αναζήτηση</button>
      <div id="candidates"></div>
      <p id="status" class="hint" role="status"></p>
    </section>

    <section class="result-filters" id="result-filters" hidden>
      <label class="check"><input id="only-no-site" type="checkbox" checked> Μόνο χωρίς website (και μόνο social)</label>
      <label class="check"><input id="only-phone" type="checkbox"> Μόνο με τηλέφωνο</label>
      <input id="text-filter" type="search" placeholder="Φίλτρο ονόματος ή διεύθυνσης">
      <div class="stats compact" id="stats"></div>
    </section>

    <section id="cards" class="cards"></section>
    <p id="empty" class="hint pad" hidden>Δεν βρέθηκαν επιχειρήσεις με αυτά τα φίλτρα.</p>

    <footer>
      <span id="usage"></span><br>
      Δεδομένα: Google Places · Χάρτης: © OpenStreetMap contributors. Τα στοιχεία της Google δεν αποθηκεύονται· μόνο το place_id και οι σημειώσεις σου.
    </footer>
  </aside>

  <main id="map"></main>

  <script src="/static/vendor/leaflet.js"></script>
  <script src="/static/google.js"></script>
</body>
</html>
