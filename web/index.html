<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Finder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Lead Finder</h1>
      <p class="sub">Επιχειρήσεις χωρίς site ή με νεκρό site</p>
    </div>
    <a id="export" class="button secondary" href="#">Εξαγωγή CSV</a>
  </header>

  <section class="stats" id="stats"></section>

  <section class="filters">
    <label>Περιοχή <select id="area"><option value="">Όλες</option></select></label>
    <label>Κατηγορία <select id="category"><option value="">Όλες</option></select></label>
    <label>Κατάσταση site
      <select id="site_status">
        <option value="">Όλες</option>
        <option value="none">Χωρίς site</option>
        <option value="dead">Νεκρό site</option>
        <option value="social_only">Μόνο social</option>
        <option value="alive">Έχει site</option>
        <option value="unchecked">Μη ελεγμένο</option>
      </select>
    </label>
    <label>Κατάσταση επαφής
      <select id="contact_status">
        <option value="">Όλες</option>
        <option value="new">Νέο</option>
        <option value="called">Κλήθηκε</option>
        <option value="interested">Ενδιαφέρεται</option>
        <option value="not_interested">Δεν ενδιαφέρεται</option>
        <option value="do_not_call">Να μην καλεστεί</option>
      </select>
    </label>
    <label class="grow">Αναζήτηση <input id="q" type="search" placeholder="όνομα, διεύθυνση, τηλέφωνο"></label>
    <div class="toggles">
      <label class="check"><input id="leads_only" type="checkbox" checked> Μόνο leads</label>
      <label class="check"><input id="has_phone" type="checkbox"> Μόνο με τηλέφωνο</label>
      <label class="check"><input id="verified" type="checkbox"> Μόνο επιβεβαιωμένοι</label>
    </div>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="name">Επιχείρηση</th>
          <th data-sort="phone">Τηλέφωνο</th>
          <th>Διεύθυνση</th>
          <th>Ωράριο</th>
          <th data-sort="site_status">Site</th>
          <th data-sort="verified" title="Έλεγξα στο Google ότι δεν έχει site">Επιβεβαίωση</th>
          <th data-sort="contact_status">Επαφή</th>
          <th>Σημειώσεις</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" hidden>Δεν βρέθηκαν επιχειρήσεις με αυτά τα φίλτρα.</p>
  </div>

  <footer>© OpenStreetMap contributors</footer>
  <script src="/static/app.js"></script>
</body>
</html>
